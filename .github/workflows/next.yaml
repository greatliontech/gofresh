name: Next

# The early-warning legs (greatliontech/actions go-next.yml), their own
# workflow: next-rc builds and tests under a published Go release
# candidate (a candidate whose stdlib changes fail structural verification
# reds this loudly for the whole freeze window), next-stable runs the fast
# tier — the structural audit pins and fast tests — under the current
# stable release, so a point release that breaks a boundary contract reds
# here as soon as it is published while the gate stays on its pinned
# Go version. Neither is a
# release gate: a red here must never block a release of the tree as
# it stands (the CI workflow's tiers are the gate release.yaml waits
# for). Same triggers as CI.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  next:
    uses: greatliontech/actions/.github/workflows/go-next.yml@main
    with:
      short: true
      short-timeout: 5m
      full-timeout: 30m
      job-minutes: 60
