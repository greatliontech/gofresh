name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Successive PR pushes supersede (per-ref group, cancelled on the next
# push). Main is keyed per-SHA so no two main runs ever share a group:
# by default GitHub cancels a group's PENDING member (cancel-in-progress
# governs only the running one), so a shared main group would leave
# rapid-push intermediate commits verdictless — and every main commit's
# verdict is what release.yaml waits for before it tags that commit.
# Per-SHA grouping removes the collision structurally while keeping a
# concurrency stanza PRs can reuse.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# This workflow IS the release gate: release.yaml cuts a tag only after
# every job of the fleet's gate (greatliontech/actions go-gate.yml: the
# plain, race and records tiers) succeeded on the pushed commit. The
# inputs are this repository's own facts:
#
# go-version pins the stock release the toolchain audit lists
# (closure/toolchainaudit.go's go1.27.1 chain row) — never `stable`, which
# would make a commit's releasability a function of Go's release
# calendar; a point release that moves the audited bytes reds the
# next-stable leg (next.yaml) first, and the listing lands before the
# pin moves.
#
# full-timeout: the suite budget measured 2026-08-27 on the 24-core dev
# host under upstream stock go1.27.0 (fork-vs-stock measured at n=1
# per arm: noise-class at that length): slowest package closure 544s,
# whole run 555s; headroom ~3.3x. Core count is a measured non-factor
# (24 -> 4 cores cost ~4% on the child-process-serialized workload); a
# cold cache lands on the job ceiling, not this flag. An overrun is a
# real finding — re-measure before raising the number.
#
# race-timeout mirrors the policy's own race invocation
# (.stipulator/policy.textproto: a 60m per-binary cap, measured
# 2026-08-28 at 36m for the whole closure unit width-capped at 2 on the
# 24-core host; the race detector measures ~4x on the observability
# proofs — CPU-bound and in-process, so core count IS a factor here).
# On a 4-vCPU/16 GB runner the closure package alone is estimated at
# 50–75 minutes plus a cold -race build of ~130 binaries; race-p 2
# keeps two race binaries' heaps inside the runner's memory. The first
# run of the race job was the measurement (2026-10-03: 54m26s).

jobs:
  gate:
    uses: greatliontech/actions/.github/workflows/go-gate.yml@main
    with:
      go-version: "1.27.1"
      short: true
      short-timeout: 5m
      full-timeout: 30m
      test-job-minutes: 60
      race: true
      race-p: 2
      race-timeout: 100m
      race-job-minutes: 150
      records: true
      stipulator-version: v0.66.1
